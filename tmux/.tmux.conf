# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Theme
set -g @catppuccin_flavor 'mocha'

# Terminal capabilities
set -g default-terminal 'tmux-256color'
set -g focus-events on
set -s escape-time 10
set -s set-clipboard external

# Indices
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows 1

# Prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Pane navigation shared with Neovim smart-splits.
# Stop at the outer edge instead of wrapping to the opposite side.
bind -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' 'if -F "#{pane_at_left}" "" "select-pane -L"'
bind -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' 'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' 'if -F "#{pane_at_top}" "" "select-pane -U"'
bind -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' 'if -F "#{pane_at_right}" "" "select-pane -R"'

# Create panes using the same h/v convention as NvChad.
bind h split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind i run-shell " \
  if [ $(( \$(tmux display -p '8*#{pane_width}-20*#{pane_height}') )) -lt 0 ]; then \
    tmux split-window -v -c '#{pane_current_path}'; \
  else \
    tmux split-window -h -c '#{pane_current_path}'; \
  fi"
bind c new-window -c '#{pane_current_path}'

# Continuously resize Neovim windows or tmux panes with Option-h/j/k/l.
bind -n M-h if -F '#{@pane-is-vim}' 'send-keys M-h' 'resize-pane -L 2'
bind -n M-j if -F '#{@pane-is-vim}' 'send-keys M-j' 'resize-pane -D 2'
bind -n M-k if -F '#{@pane-is-vim}' 'send-keys M-k' 'resize-pane -U 2'
bind -n M-l if -F '#{@pane-is-vim}' 'send-keys M-l' 'resize-pane -R 2'

# Utilities
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Vim-style copy mode
set -g mouse on
set -g mode-keys vi
bind b copy-mode \;\
  send-keys -X start-of-line \;\
  send-keys -X search-backward -- '❯'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Navigate tmux panes while copy mode is active.
bind -T copy-mode-vi C-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}' '' 'select-pane -R'

# Initialize TPM (keep this line at the very bottom).
run '~/.tmux/plugins/tpm/tpm'
