# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'none'

# Terminal capabilities
set -g default-terminal 'tmux-256color'
set -g allow-passthrough on
set -g focus-events on
set -s escape-time 10
set -s set-clipboard external

# Indices
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows 1

# Prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Pane navigation shared with Neovim smart-splits.
# Stop at the outer edge instead of wrapping to the opposite side.
bind -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' 'if -F "#{pane_at_left}" "" "select-pane -L"'
bind -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' 'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' 'if -F "#{pane_at_top}" "" "select-pane -U"'
bind -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' 'if -F "#{pane_at_right}" "" "select-pane -R"'

# Create panes using the same h/v convention as NvChad.
bind h split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind i run-shell " \
  if [ $(( \$(tmux display -p '8*#{pane_width}-20*#{pane_height}') )) -lt 0 ]; then \
    tmux split-window -v -c '#{pane_current_path}'; \
  else \
    tmux split-window -h -c '#{pane_current_path}'; \
  fi"
bind c new-window -c '#{pane_current_path}'

# Continuously resize Neovim windows or tmux panes with Option-h/j/k/l.
bind -n M-h if -F '#{@pane-is-vim}' 'send-keys M-h' 'resize-pane -L 2'
bind -n M-j if -F '#{@pane-is-vim}' 'send-keys M-j' 'resize-pane -D 2'
bind -n M-k if -F '#{@pane-is-vim}' 'send-keys M-k' 'resize-pane -U 2'
bind -n M-l if -F '#{@pane-is-vim}' 'send-keys M-l' 'resize-pane -R 2'

# Utilities
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Vim-style copy mode
set -g mouse on
set -g mode-keys vi
bind b copy-mode \;\
  send-keys -X start-of-line \;\
  send-keys -X search-backward -- '❯'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Navigate tmux panes while copy mode is active.
bind -T copy-mode-vi C-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}' '' 'select-pane -R'

# Initialize plugins before applying the final status-line overrides.
run '~/.tmux/plugins/tpm/tpm'

# Minimal Catppuccin Mocha status line
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left ''
set -g status-left-length 0
set -g status-right-length 80
set -g status-style 'bg=default,fg=#cdd6f4'
set -g window-status-separator ''

# Window state: bell (red), activity (blue), inactive (overlay), current
# (yellow). The icon script resolves the real foreground process from the
# pane's tty (pane_current_command reports the interpreter, e.g. `node` for
# pi) and prefixes multi-pane windows with nf-md-view_quilt.
set -g window-status-format '#{?window_bell_flag,#[fg=#f38ba8],#{?window_activity_flag,#[fg=#89b4fa],#[fg=#6c7086]}}#[bg=default,nobold] #I #(~/Documents/dotfiles/tmux/scripts/window-icon.zsh #{window_panes} #{q:pane_current_command} #{q:pane_tty}) '
set -g window-status-current-format '#[fg=#f9e2af,bg=default,bold] #I #(~/Documents/dotfiles/tmux/scripts/window-icon.zsh #{window_panes} #{q:pane_current_command} #{q:pane_tty}) '

# System information and local time, separated by Mocha accent colors.
set -g status-right '#[fg=#89b4fa,bg=default] #(~/Documents/dotfiles/tmux/scripts/system-info.sh cpu)  #[fg=#a6e3a1] #(~/Documents/dotfiles/tmux/scripts/system-info.sh memory)  #[fg=#f9e2af]󰁹 #(~/Documents/dotfiles/tmux/scripts/system-info.sh battery)  #[fg=#cba6f7]󰥔 %m-%d %H:%M '

# extended-keys
set -g extended-keys on
set -g extended-keys-format csi-u
