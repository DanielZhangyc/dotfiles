# Kitty + zmx: Kitty owns native tabs/splits; zmx persistence is opt-in.

# --- Typography ---
include current-theme.conf
font_family Maple Mono NF CN
font_size 18
macos_thicken_font 0.5
modify_font cell_height 6px

# --- Window and appearance ---
repaint_delay 2
background_opacity 0.90
background_blur 20
macos_titlebar_color background
macos_option_as_alt left
window_padding_width 12
hide_window_decorations titlebar-only
remember_window_size no
initial_window_width 95c
initial_window_height 24c
window_border_width 1px
active_border_color #585b70
inactive_border_color #45475a

# --- Native tab bar ---
tab_bar_edge top
tab_bar_style custom
tab_bar_margin_width 6
tab_bar_margin_height 6 0
tab_bar_background none
tab_bar_margin_color #1e1e2e
active_tab_foreground #1e1e2e
active_tab_background #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #1e1e2e
active_tab_font_style normal
tab_title_template "{fmt.fg._9399b2}{index}{fmt.fg.tab} {title}"
active_tab_title_template "{fmt.fg._585b70}{index}{fmt.fg.tab} {title}"
tab_title_max_length 48
tab_bar_min_tabs 1

# --- Cursor & shaders ---
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.07 0.16
cursor_trail_start_threshold 1 1
custom_shaders active-tab-slide

# --- Mouse, scrollback & integration ---
mouse_hide_wait -1.0
copy_on_select clipboard
scrollback_lines 100000
confirm_os_window_close 1
allow_remote_control socket-only
listen_on unix:/tmp/kitty.sock
shell_integration no-cursor
enabled_layouts splits,stack,tall,grid

# --- Cross-pane navigation (smart-splits.nvim) ---
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

map alt+h kitten relative_resize.py left 2
map alt+j kitten relative_resize.py down 2
map alt+k kitten relative_resize.py up 2
map alt+l kitten relative_resize.py right 2
map --when-focus-on var:IS_NVIM alt+h send_key alt+h
map --when-focus-on var:IS_NVIM alt+j send_key alt+j
map --when-focus-on var:IS_NVIM alt+k send_key alt+k
map --when-focus-on var:IS_NVIM alt+l send_key alt+l

# --- Tabs and windows ---
map cmd+t launch --type=tab --cwd=current
map cmd+w close_window
map cmd+shift+left previous_tab
map cmd+shift+right next_tab
map cmd+shift+e layout_action equalize
map cmd+shift+f last_used_layout
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window up
map cmd+alt+down neighboring_window down
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# --- Common macOS behavior ---
map cmd+a kitten select_all.py
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map cmd+backspace send_text all \x15
map cmd+enter toggle_fullscreen
map cmd+plus change_font_size all +1.0
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
map cmd+shift+comma load_config_file

# Consume Rime toggle key after input method handles it.
map f18 discard_event
