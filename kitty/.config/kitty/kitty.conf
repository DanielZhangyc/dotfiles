# Catppuccin Mocha, copied from the existing kitty installation.
include current-theme.conf

font_family Maple Mono NF CN
font_size 18
macos_thicken_font 0.5
modify_font cell_height 6px

# Keep rendering simple to reduce GPU and memory pressure.
background_opacity 1.0
background_blur 0
cursor_trail 0
scrollback_lines 10000

window_padding_width 12
hide_window_decorations titlebar-only
remember_window_size no
initial_window_width 95c
initial_window_height 24c

cursor_shape beam
macos_option_as_alt left
mouse_hide_wait -1.0
copy_on_select clipboard
confirm_os_window_close 1

# tmux owns panes and tabs; keep kitty to one stacked terminal surface.
enabled_layouts stack
tab_bar_style hidden
# Disable native pane/tab shortcuts before applying the tmux bindings below.
map kitty_mod+enter no_op
map cmd+enter no_op
map kitty_mod+] no_op
map kitty_mod+[ no_op
map kitty_mod+` no_op
map kitty_mod+1 no_op
map cmd+1 no_op
map kitty_mod+2 no_op
map cmd+2 no_op
map kitty_mod+3 no_op
map cmd+3 no_op
map kitty_mod+4 no_op
map cmd+4 no_op
map kitty_mod+5 no_op
map cmd+5 no_op
map kitty_mod+6 no_op
map cmd+6 no_op
map kitty_mod+7 no_op
map cmd+7 no_op
map kitty_mod+8 no_op
map cmd+8 no_op
map kitty_mod+9 no_op
map cmd+9 no_op
map kitty_mod+0 no_op
map kitty_mod+f7 no_op
map kitty_mod+f8 no_op
map kitty_mod+right no_op
map shift+cmd+] no_op
map ctrl+tab no_op
map kitty_mod+left no_op
map shift+cmd+[ no_op
map ctrl+shift+tab no_op
map kitty_mod+. no_op
map kitty_mod+, no_op

# Ghostty sends a NUL prefix to tmux; keep the same prefix and bindings.
map cmd+t send_text all \x00c
map cmd+w send_text all \x00&
map cmd+d send_text all \x00v
map cmd+shift+d send_text all \x00h
map cmd+shift+left send_text all \x00p
map cmd+shift+right send_text all \x00n
map cmd+shift+e send_text all \x00E
map cmd+shift+f send_text all \x00z
map cmd+1 send_text all \x001
map cmd+2 send_text all \x002
map cmd+3 send_text all \x003
map cmd+4 send_text all \x004
map cmd+5 send_text all \x005
map cmd+6 send_text all \x006
map cmd+7 send_text all \x007
map cmd+8 send_text all \x008
map cmd+9 send_text all \x009

map cmd+plus change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
map cmd+shift+comma load_config_file
